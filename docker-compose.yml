services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: autoflow
      POSTGRES_USER: autoflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoflow_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - autoflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoflow -d autoflow"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  autoflow-postgres:
